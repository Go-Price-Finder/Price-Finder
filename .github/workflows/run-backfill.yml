name: Run catalog backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backfill SQL against Supabase
        run: npx -y supabase db query --db-url "$SUPABASE_DB_URL" --file scratch/backfill-catalog-products-ALL.sql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
