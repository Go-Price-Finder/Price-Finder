name: Verify

# Enforces CLAUDE.md's "fix → verify → review → push" rule in CI: the same
# three checks (tsc --noEmit, eslint, next build) that the working rules
# require before any push, run automatically on every push to main and on
# every pull request.
#
# Exactly two secrets are wired in, on the Build step only: the anon
# Supabase URL and key (see the comment on that step for why that is safe).
# Nothing else is, and nothing else should be — in particular the checkout,
# install, type-check and lint steps need no credentials at all.
#
# This job previously ran with no secrets because all 1043 static pages
# prerendered from lib/partners.ts and no app/ or components/ file imported
# lib/catalog.ts. The Step 14 call-site cutover changes that: routes move to
# reading the catalog from Supabase at build time, so `next build` needs the
# anon credentials. They are added ahead of the first batch so the cutover
# does not land on a red build.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches local dev and Vercel's project setting (nodeVersion 24.x),
      # pinned explicitly via package.json "engines" so all three agree.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Downloads Schibsted Grotesk and Fraunces from Google Fonts at build
      # time via next/font/google. In a production build Next re-throws on a
      # failed font fetch (it only falls back to a local font in dev), so a
      # blocked or rate-limited fonts.gstatic.com fails the whole job. That
      # is why this cannot run in a network-restricted sandbox.
      #
      # anon key only. Verified 2026-08-09: RLS is enabled on catalog_products
      # and partners with SELECT-only policies (USING true, role public);
      # UPDATE/DELETE as anon affect 0 rows and INSERT raises an RLS error.
      # Both vars are NEXT_PUBLIC_* and are already inlined into the client
      # bundle, so CI gains nothing a browser visitor does not already have.
      # NEVER add SUPABASE_SERVICE_ROLE_KEY here — it bypasses RLS entirely.
      # MIGRATION DRIFT, the half the build cannot do (findings §57/§58).
      # `npm run build` asserts files == manifest. This asserts manifest ==
      # database, and only the two together prove the repo can rebuild the
      # schema. It lives here because it needs the least-privilege
      # migration_auditor role — SELECT on exactly
      # supabase_migrations.schema_migrations — whose password is set by a
      # human and held as a secret, deliberately out of reach of the Vercel
      # build and of AI sessions.
      #
      # If the secret is unset the script EXITS 2 rather than skipping: a
      # check that passes when it cannot run reports coverage it does not
      # have. Run before Build so a drifted schema fails fast.
      - name: Migration manifest matches the database
        run: node scripts/check-migration-manifest.mjs
        env:
          MIGRATION_AUDITOR_URL: ${{ secrets.MIGRATION_AUDITOR_URL }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
